name: go_delivery_frontend
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  accordion: ^2.6.0
  animate_do: ^3.3.4
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  cupertino_icons: ^1.0.2
  dio: ^5.4.2+1
  equatable: ^2.0.5
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_dotenv: ^5.1.0
  flutter_lazy_indexed_stack: ^0.0.6
  flutter_local_notifications: ^18.0.0
  flutter_map: ^7.0.2
  flutter_slidable: ^3.1.2
  flutter_stripe: ^11.3.0
  flutter_svg: ^2.0.10
  google_maps_flutter: ^2.2.5
  get_it: ^8.0.3
  go_router: ^14.3.0
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  intl: ^0.19.0
  isar:
    hosted: https://pub.isar-community.dev
    version: 3.1.8
  isar_flutter_libs:
    hosted: https://pub.isar-community.dev
    version: 3.1.8
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  shimmer: ^3.0.0
  timeago: ^3.6.1
  url_launcher: ^6.1.14

dev_dependencies:
  build_runner: any
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isar_generator:
    hosted: https://pub.isar-community.dev
    version: 3.1.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/presentation/core/app.dart
    - assets/icon/logo-white.svg
    - assets/icon/logo.svg
    - assets/icon/google.svg
    - assets/icon/facebook.svg
    - assets/icon/apple.svg
    - assets/not-found-image.svg
    - assets/icon/order_not_found.svg
    - assets/icon/user_150x150.png
    - assets/empty_states/coupon_emptystate.svg
    - assets/empty_states/cart_emptystate.svg
    - assets/empty_states/order_emptystate.svg
    - assets/visa_card.svg
    - assets/masterc_card.svg

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
          style: normal
          weight: 400
        - asset: fonts/Montserrat-SemiBold.ttf
          style: normal
          weight: 400
        - asset: fonts/Montserrat-SemiBoldItalic.ttf
          style: italic
          weight: 500
        - asset: fonts/Montserrat-Thin.ttf
          style: normal
          weight: 400
        - asset: fonts/Montserrat-Italic.ttf
          style: italic
          weight: 400
        - asset: fonts/Montserrat-Black.ttf
          style: normal
          weight: 800
        - asset: fonts/Montserrat-Bold.ttf
          style: normal
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_18pt-Bold.ttf
          weight: 600
        - asset: fonts/Inter_18pt-SemiBold.ttf
          weight: 700
        - asset: fonts/Inter_18pt-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_app.png"
  min_sdk_android: 21
  remove_alpha_ios: true
