name: go_delivery_frontend
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  accordion: ^2.6.0
  animate_do: ^3.3.4
  card_swiper: ^3.0.1
  cupertino_icons: ^1.0.2
  dio: ^5.4.2+1
  equatable: ^2.0.5
  firebase_core: ^3.7.0
  firebase_messaging: ^15.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_dotenv: ^5.1.0
  flutter_lazy_indexed_stack: ^0.0.6
  flutter_local_notifications: ^18.0.0
  flutter_slidable: ^3.1.1
  flutter_svg: ^2.0.10+1
  get_it: ^8.0.2
  go_router: ^14.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  timeago: ^3.6.1
dev_dependencies:
  flutter_launcher_icons: ^0.9.2

  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/presentation/core/app.dart
    - assets/icon/logo-white.svg
    - assets/icon/logo.svg
    - assets/icon/google.svg
    - assets/icon/facebook.svg
    - assets/icon/apple.svg
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
          style: normal
          weight: 400
        - asset: fonts/Montserrat-SemiBold.ttf
          style: normal
          weight: 400
        - asset: fonts/Montserrat-SemiBoldItalic.ttf
          style: italic
          weight: 500
        - asset: fonts/Montserrat-Thin.ttf
          style: normal
          weight: 400
        - asset: fonts/Montserrat-Italic.ttf
          style: italic
          weight: 400
        - asset: fonts/Montserrat-Black.ttf
          style: normal
          weight: 800
        - asset: fonts/Montserrat-Bold.ttf
          style: normal
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_18pt-Bold.ttf
          weight: 600
        - asset: fonts/Inter_18pt-SemiBold.ttf
          weight: 700
        - asset: fonts/Inter_18pt-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_app.png"
  min_sdk_android: 21
  remove_alpha_ios: true