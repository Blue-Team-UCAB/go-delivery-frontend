name: go_delivery_frontend
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  bloc: ^8.1.4
  bloc_test: ^9.0.0-dev.1
  cupertino_icons: ^1.0.8
  dio: ^4.0.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_dotenv: ^5.1.0
  flutter_slidable: ^3.1.1
  get_it: ^7.7.0
  go_router: ^14.6.0
  shared_preferences: ^2.0.13
  uuid: ^3.0.7

dev_dependencies:
  flutter_launcher_icons: ^0.9.2

  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
      - family: Inter
        fonts:
          - asset: fonts/Inter_18pt-Thin.ttf
            weight: 100
          - asset: fonts/Inter_18pt-ExtraLight.ttf
            weight: 200
          - asset: fonts/Inter_18pt-Light.ttf
            weight: 300
          - asset: fonts/Inter_18pt-Regular.ttf
            weight: 400
          - asset: fonts/Inter_18pt-Medium.ttf
            weight: 500
          - asset: fonts/Inter_18pt-Bold.ttf
            weight: 600
          - asset: fonts/Inter_18pt-SemiBold.ttf
            weight: 700
          - asset: fonts/Inter_18pt-ExtraBold.ttf
            weight: 800
  assets:
    - .env
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo_go_dely.png"


