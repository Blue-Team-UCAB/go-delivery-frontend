name: go_delivery_frontend
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_dotenv: ^5.1.0
  bloc: ^8.1.4
  bloc_test: ^9.0.0-dev.1
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^10.1.0
  uuid: ^3.0.7
  dio: ^4.0.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.9.2

  flutter_lints: ^4.0.0

flutter:
  assets:
    - .env
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo_go_dely.png"